name: CI Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FoxuMarsDisplay.slnx

      - name: Build Solution (Release)
        run: dotnet build FoxuMarsDisplay.slnx -c Release --no-restore

      - name: Build WPF App (Release)
        run: dotnet build src/FoxuMarsDisplay/FoxuMarsDisplay.csproj -c Release

      - name: Run Core Unit Tests
        run: dotnet test tests/FoxuMarsDisplay.Core.Tests/FoxuMarsDisplay.Core.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
